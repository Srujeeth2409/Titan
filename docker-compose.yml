services:
  postgres:
    networks:
      - titan-network
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: titan
      POSTGRES_PASSWORD: titan
      POSTGRES_DB: titan
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titan -d titan"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    networks:
      - titan-network
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    networks:
      - titan-network
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    networks:
      - titan-network
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql+asyncpg://titan:titan@postgres:5432/titan
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      CORS_ORIGIN: http://localhost:3000
      DEFAULT_LLM_PROVIDER: ollama
      DEFAULT_MODEL: llama3.1:8b
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started

  frontend:
    build: ./frontend
    env_file: .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
networks:
  titan-network:
    external: true
    name: titan_titan-network