      <stop offset="0%" stop-color="#48e588"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="chatShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#047857" flood-opacity="0.35"/>
